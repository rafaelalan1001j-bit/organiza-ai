<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OrganizaAI — Gerenciador de Tarefas{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .footer {
            margin-top: auto;
            background-color: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 1rem 0;
            color: #64748b;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{% url 'home' %}">
                <i class="bi bi-check2-circle fs-4"></i>
                <span>OrganizaAI</span>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'home' %}">
                            <i class="bi bi-list-task me-1"></i> Tarefas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'categorias' %}">
                            <i class="bi bi-folder me-1"></i> Categorias
                        </a>
                    </li>
                </ul>

                <a href="/admin/" target="_blank" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-shield-lock me-1"></i> Django Admin
                </a>
            </div>
        </div>
    </nav>

    <!-- Conteúdo -->
    <main class="container pb-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="footer text-center">
        <div class="container">
            OrganizaAI &bull; Desenvolvido com Django, Bootstrap & SQLite &bull; NAP 2
        </div>
    </footer>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
